; bone position, every bone must have a position setting
[BonePosition]
; format:
; bonename=pos-type:pos-value
;  while pos-value diff from pos-type, when pos-type = 
;   b = ref to bone, pos-value is bone-in-char
;   bbs = ref to point between 2 bones, pos-value is first-bone:second-bone:scale-from-first
;   bo = ref to bone and add offset, pos-value is offset (x,y,z)
;   br = ref to bone and reset some axis value, pos-value is reset value (x,y,z), if value of some axis is NAN, that axis left no change
; センター
OPTCENTER=b:cf_J_Root
ROOT=b:cf_J_Root
CENTER=bbs:cf_J_LegUp00_R:cf_J_LegUp00_L:0.5
GROOVE=bbs:cf_J_LegUp00_R:cf_J_LegUp00_L:0.5
BACK_HIPS=bbs:cf_J_LegUp00_R:cf_J_LegUp00_L:0.5
